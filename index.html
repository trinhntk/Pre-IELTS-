<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-IELTS Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF7F0;
    --rule: #DED5C0;
    --ink: #22314F;
    --body: #4A5568;
    --accent: #A23B3B;
    --muted: #9C9587;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 37px,
        var(--rule) 38px
      ),
      var(--paper);
    color: var(--body);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    max-width: 640px;
    margin: 0 auto;
    padding: 88px 24px 96px;
  }

  header h1{
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 5vw, 2.7rem);
    color: var(--ink);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  header p{
    margin: 0 0 40px;
    font-size: 1.02rem;
    line-height: 1.6;
    max-width: 46ch;
  }

  header .rule{
    border: none;
    border-top: 2px solid var(--ink);
    border-bottom: 1px solid var(--rule);
    height: 4px;
    margin: 0 0 44px;
  }

  ol.lessons{
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .lesson{
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 4px 18px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .lesson:first-child{ padding-top: 0; }

  .lesson .num{
    font-family: 'Lora', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.6rem;
    color: var(--accent);
    line-height: 1.3;
  }

  .lesson .title{
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 1.25rem;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .lesson a.open{
    color: var(--ink);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px;
  }

  .lesson a.open:hover{ color: var(--accent); }

  .lesson a.open:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .lesson.placeholder .title,
  .lesson.placeholder .num{ color: var(--muted); }

  .lesson.placeholder .note{
    font-size: 0.95rem;
    color: var(--muted);
    font-style: italic;
  }

  footer{
    margin-top: 48px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference){
    .lesson a.open{ transition: color 0.15s ease; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Pre-IELTS Practice</h1>
      <p>Bộ tài liệu luyện tập tiếng Anh, tổng hợp theo từng buổi học. Chọn một bài bên dưới để bắt đầu.</p>
      <hr class="rule">
    </header>

    <ol class="lessons">
      <li class="lesson">
        <span class="num">01</span>
        <div>
          <p class="title">Lesson 1</p>
          <a class="open" href="Worksheet_Lesson1.html">Mở bài tập</a>
        </div>
      </li>

      <!--
        Thêm bài mới: copy khối <li class="lesson"> ở trên,
        đổi số thứ tự, tên bài, và href thành tên file mới.
        Ví dụ cho Lesson 2:

        <li class="lesson">
          <span class="num">02</span>
          <div>
            <p class="title">Lesson 2</p>
            <a class="open" href="Worksheet_Lesson2.html">Mở bài tập</a>
          </div>
        </li>
      -->
    </ol>

    <footer>Cập nhật lần cuối: tháng 9/2026</footer>
  </div>
</body>
</html>
